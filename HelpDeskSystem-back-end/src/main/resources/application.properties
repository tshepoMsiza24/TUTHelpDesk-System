spring.application.name=TUTHelpDesk

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.physical_naming_strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server port
server.port=8080

# JWT Configuration
jwt.secret=TUTHelpDeskSecretKey2024VeryLongSecretKeyForJWTTokenGeneration
jwt.expiration=86400000

# CORS
spring.web.cors.allowed-origins=http://localhost:4200

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.HelpDeskSystem=DEBUG
